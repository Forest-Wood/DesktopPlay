name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable tag to build and publish without moving it
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tagVersion = $env:RELEASE_TAG -replace '^v', ''
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'A stable version tag is required' }
          if ($tagVersion -ne $packageVersion) {
            throw "Tag version '$tagVersion' does not match package.json version '$packageVersion'."
          }

      - name: Refuse to overwrite a published release
        id: release_guard
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pages = gh api --paginate --slurp "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify existing release status' }
          $matching = @(foreach ($page in $pages) { foreach ($item in $page) { if ($item.tag_name -eq $env:RELEASE_TAG) { $item } } })
          if ($matching.Count -gt 1) { throw 'Multiple releases match this tag' }
          if ($matching.Count -eq 1 -and !$matching[0].draft) { throw 'This release is already published. Use a new version and tag.' }
          "draft_exists=$($matching.Count -eq 1)".ToLowerInvariant() >> $env:GITHUB_OUTPUT

      - name: Unit tests
        run: npm test

      - name: Build Windows x64 packages
        run: npm run dist

      - name: Verify updater metadata and write SHA-256 sums
        run: |
          node scripts/verify-release.mjs
          node scripts/verify-update-runtime.mjs

      - name: Upload all assets to a draft release
        if: steps.release_guard.outputs.draft_exists != 'true'
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            release/*-x64.exe
            release/SHA256SUMS.txt
            release/latest.yml
            release/*-Setup-x64.exe.blockmap

      - name: Replace assets in an existing draft without rewriting release metadata
        if: steps.release_guard.outputs.draft_exists == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $names = @("DesktopPet-$version-Setup-x64.exe", "DesktopPet-$version-Portable-x64.exe", 'SHA256SUMS.txt', 'latest.yml', "DesktopPet-$version-Setup-x64.exe.blockmap")
          $files = @($names | ForEach-Object { (Get-Item -LiteralPath (Join-Path 'release' $_)).FullName })
          gh release upload $env:RELEASE_TAG @files --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Failed to replace draft assets; keep release unpublished' }

      - name: Publish only after every asset is verified
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tag endpoint returns published releases only. Find the exact draft in the release collection.
          $pages = gh api --paginate --slurp "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read draft releases' }
          $matching = @(foreach ($page in $pages) { foreach ($item in $page) { if ($item.tag_name -eq $env:RELEASE_TAG) { $item } } })
          if ($matching.Count -ne 1 -or !$matching[0].draft) { throw 'Expected exactly one draft release' }
          $release = $matching[0]
          $version = $env:RELEASE_TAG -replace '^v', ''
          $names = @("DesktopPet-$version-Setup-x64.exe", "DesktopPet-$version-Portable-x64.exe", 'SHA256SUMS.txt', 'latest.yml', "DesktopPet-$version-Setup-x64.exe.blockmap")
          if ($release.assets.Count -ne $names.Count) { throw 'Unexpected release asset count' }
          foreach ($name in $names) {
            $asset = @($release.assets | Where-Object name -eq $name)
            $localFile = Get-Item -LiteralPath (Join-Path 'release' $name)
            $hash = (Get-FileHash -LiteralPath $localFile.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($asset.Count -ne 1 -or $asset[0].state -ne 'uploaded' -or $asset[0].size -ne $localFile.Length -or $asset[0].digest -ne "sha256:$hash") { throw "Incomplete or mismatched asset: $name" }
          }
          gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)" -F draft=false -F prerelease=false -f make_latest=true
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish the verified draft' }
