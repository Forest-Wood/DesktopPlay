name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tagVersion = $env:RELEASE_TAG -replace '^v', ''
          if ($tagVersion -ne $packageVersion) {
            throw "Tag version '$tagVersion' does not match package.json version '$packageVersion'."
          }

      - name: Unit tests
        run: npm test

      - name: Build Windows x64 packages
        run: npm run dist

      - name: Verify packages and write SHA-256 sums
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $packages = @(Get-ChildItem -Path release -File -Filter '*-x64.exe' | Sort-Object Name)
          $expected = @(
            "DesktopPet-$version-Setup-x64.exe",
            "DesktopPet-$version-Portable-x64.exe"
          )
          if ($packages.Count -ne 2 -or @(Compare-Object $expected $packages.Name).Count -ne 0) {
            throw "Expected exactly the NSIS Setup and Portable x64 executables. Found: $($packages.Name -join ', ')"
          }
          $lines = foreach ($package in $packages) {
            $hash = (Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($package.Name)"
          }
          Set-Content -Path release/SHA256SUMS.txt -Value $lines -Encoding ascii

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release/*-x64.exe
            release/SHA256SUMS.txt
